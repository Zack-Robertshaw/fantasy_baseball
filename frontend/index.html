<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fantasy Baseball AI Co-Manager</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --success: #3fb950;
      --warning: #d29922;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1.5rem;
      line-height: 1.5;
    }
    h1 { font-size: 1.5rem; margin: 0 0 1rem; }
    h2 { font-size: 1.1rem; margin: 1rem 0 0.5rem; color: var(--muted); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    button {
      background: var(--accent);
      color: var(--bg);
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    select, input {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem;
      margin-right: 0.5rem;
    }
    .row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin-bottom: 0.5rem; }
    .badge { font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 4px; background: var(--border); }
    .success { color: var(--success); }
    .muted { color: var(--muted); }
    #auth-section, #dashboard { display: none; }
    #auth-section.visible, #dashboard.visible { display: block; }
    .rec-item { padding: 0.5rem 0; border-bottom: 1px solid var(--border); }
    .rec-item:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <h1>Fantasy Baseball AI Co-Manager</h1>

  <div id="auth-section" class="card">
    <p class="muted">Connect your Yahoo Fantasy account to get started.</p>
    <button id="connect-btn">Connect Yahoo</button>
  </div>

  <div id="dashboard">
    <div class="card">
      <h2>League & Team</h2>
      <div class="row" id="profile-row" style="display: none;">
        <select id="profile-select">
          <option value="">Saved team profiles...</option>
        </select>
      </div>
      <div class="row">
        <select id="league-select">
          <option value="">Select league...</option>
        </select>
        <select id="team-select">
          <option value="">Select team...</option>
        </select>
      </div>
    </div>

    <div class="card">
      <h2>Lineup Optimizer</h2>
      <p class="muted">Use the selected league and team to preview or apply combined pitcher and batter lineup changes.</p>
      <div class="row">
        <button id="optimize-btn">Optimize Lineup (Preview)</button>
        <button id="optimize-all-btn" class="secondary">Dry Run All Teams</button>
        <button id="apply-btn" class="secondary">Apply Changes</button>
      </div>
      <div id="optimize-result"></div>
    </div>
  </div>

  <script>
    const API = '/api';
    let leagues = [], teams = [], configuredTeams = [];

    async function checkAuth() {
      const r = await fetch(API + '/auth/status');
      const d = await r.json();
      if (d.authenticated) {
        document.getElementById('auth-section').classList.remove('visible');
        document.getElementById('dashboard').classList.add('visible');
        loadLeagues();
      } else {
        document.getElementById('auth-section').classList.add('visible');
      }
    }

    document.getElementById('connect-btn').onclick = async () => {
      const r = await fetch(API + '/auth/url');
      const d = await r.json();
      window.location.href = d.url;
    };

    async function loadLeagues() {
      const [rAll, rCfg, rTeams] = await Promise.all([
        fetch(API + '/leagues'),
        fetch(API + '/leagues/configured'),
        fetch(API + '/teams/configured'),
      ]);
      const d = await rAll.json();
      const cfg = await rCfg.json();
      const teamCfg = await rTeams.json();
      const configured = cfg.leagues || [];
      configuredTeams = teamCfg.teams || [];
      const byKey = new Map((d.leagues || []).map(l => [l.league_key, l]));
      leagues = configured.map(c => {
        const y = byKey.get(c.league_key);
        if (y) {
          return { ...y, displayLabel: c.label };
        }
        return {
          league_key: c.league_key,
          name: c.label,
          num_teams: null,
          displayLabel: c.label,
        };
      });
      const sel = document.getElementById('league-select');
      sel.innerHTML = '<option value="">Select league...</option>';
      leagues.forEach(l => {
        const opt = document.createElement('option');
        opt.value = l.league_key;
        const title = l.displayLabel && l.name
          ? `${l.displayLabel} — ${l.name}`
          : (l.name || l.displayLabel || l.league_key);
        opt.textContent = title;
        sel.appendChild(opt);
      });

      const profileRow = document.getElementById('profile-row');
      const profileSelect = document.getElementById('profile-select');
      profileSelect.innerHTML = '<option value="">Saved team profiles...</option>';
      configuredTeams.forEach((profile, index) => {
        const opt = document.createElement('option');
        opt.value = String(index);
        opt.textContent = profile.label || profile.team_key;
        profileSelect.appendChild(opt);
      });
      profileRow.style.display = configuredTeams.length ? 'flex' : 'none';
    }

    async function loadTeamsForLeague(leagueKey, preferredTeamKey = '') {
      document.getElementById('team-select').innerHTML = '<option value="">Select team...</option>';
      if (!leagueKey) return;
      const r = await fetch(API + `/leagues/${encodeURIComponent(leagueKey)}/teams`);
      const d = await r.json();
      teams = d.teams || [];
      teams.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t.team_key;
        const matchingProfile = configuredTeams.find(profile => profile.team_key === t.team_key);
        opt.textContent = matchingProfile?.label
          ? `${matchingProfile.label} — ${t.name || t.team_key}`
          : (t.name || t.team_key);
        document.getElementById('team-select').appendChild(opt);
      });
      if (preferredTeamKey) {
        document.getElementById('team-select').value = preferredTeamKey;
      }
    }

    document.getElementById('league-select').onchange = async function() {
      const leagueKey = this.value;
      const profile = configuredTeams.find(item => item.league_key === leagueKey);
      await loadTeamsForLeague(leagueKey, profile?.team_key || '');
    };

    document.getElementById('profile-select').onchange = async function() {
      if (this.value === '') {
        return;
      }
      const selected = configuredTeams[Number(this.value)];
      if (!selected) {
        return;
      }
      document.getElementById('league-select').value = selected.league_key;
      await loadTeamsForLeague(selected.league_key, selected.team_key);
    };

    function formatChange(item) {
      const from = item.from ? String(item.from) : '';
      const to = item.to ? String(item.to) : '';
      const transition = from && to ? `${from} -> ${to}` : (to ? `-> ${to}` : (item.action || 'update'));
      const reason = item.reason ? ` (${item.reason})` : '';
      return `${item.player}: ${transition}${reason}`;
    }

    function renderOptimizationResult(result, mode) {
      const el = document.getElementById('optimize-result');
      const pitcherDetails = result.pitcher_details || [];
      const batterDetails = result.batter_details || [];
      let html = '';

      if (mode === 'apply') {
        if (result.error) {
          html += `<p class="muted">${result.error}</p>`;
        } else if (result.applied) {
          html += '<p class="success">Lineup updated successfully.</p>';
        } else {
          html += '<p class="muted">No changes applied.</p>';
        }
      }

      if (!pitcherDetails.length && !batterDetails.length) {
        html += '<span class="success">Lineup looks good - no changes needed.</span>';
        el.innerHTML = html;
        return;
      }

      if (pitcherDetails.length) {
        html += '<strong>Pitcher changes</strong><ul>' + pitcherDetails.map(item =>
          `<li>${formatChange(item)}</li>`
        ).join('') + '</ul>';
      }

      if (batterDetails.length) {
        html += '<strong>Batter changes</strong><ul>' + batterDetails.map(item =>
          `<li>${formatChange(item)}</li>`
        ).join('') + '</ul>';
      }

      el.innerHTML = html;
    }

    function renderBatchOptimizationResult(result) {
      const el = document.getElementById('optimize-result');
      const results = result.results || [];
      let html = `<p class="muted">Processed ${result.teams_processed || 0} team(s); ${result.teams_with_changes || 0} with suggested changes.</p>`;

      if (!results.length) {
        el.innerHTML = html + '<span class="muted">No configured teams were available.</span>';
        return;
      }

      results.forEach(teamResult => {
        const pitcherDetails = teamResult.pitcher_details || [];
        const batterDetails = teamResult.batter_details || [];
        html += `<div class="rec-item"><strong>${teamResult.label || teamResult.team_key}</strong>`;
        if (teamResult.error) {
          html += `<p class="muted">${teamResult.error}</p></div>`;
          return;
        }
        if (!pitcherDetails.length && !batterDetails.length) {
          html += '<div class="success">No changes needed.</div></div>';
          return;
        }
        if (pitcherDetails.length) {
          html += '<div><span class="badge">Pitchers</span><ul>' + pitcherDetails.map(item =>
            `<li>${formatChange(item)}</li>`
          ).join('') + '</ul></div>';
        }
        if (batterDetails.length) {
          html += '<div><span class="badge">Batters</span><ul>' + batterDetails.map(item =>
            `<li>${formatChange(item)}</li>`
          ).join('') + '</ul></div>';
        }
        html += '</div>';
      });

      el.innerHTML = html;
    }

    document.getElementById('optimize-btn').onclick = async function() {
      const teamKey = document.getElementById('team-select').value;
      if (!teamKey) { alert('Select a team first'); return; }
      const r = await fetch(API + `/optimize-batting-lineup?team_key=${encodeURIComponent(teamKey)}&dry_run=true`, {
        method: 'POST',
      });
      const d = await r.json();
      renderOptimizationResult(d, 'preview');
    };

    document.getElementById('optimize-all-btn').onclick = async function() {
      const r = await fetch(API + '/optimize-all-lineups?dry_run=true', {
        method: 'POST',
      });
      const d = await r.json();
      renderBatchOptimizationResult(d);
    };

    document.getElementById('apply-btn').onclick = async function() {
      const teamKey = document.getElementById('team-select').value;
      if (!teamKey) { alert('Select a team first'); return; }
      if (!confirm('Apply lineup changes?')) return;
      const r = await fetch(API + `/optimize-batting-lineup?team_key=${encodeURIComponent(teamKey)}&dry_run=false`, {
        method: 'POST',
      });
      const d = await r.json();
      renderOptimizationResult(d, 'apply');
    };

    // Check URL for auth callback
    const params = new URLSearchParams(location.search);
    if (params.get('auth') === 'success') {
      history.replaceState({}, '', location.pathname);
      checkAuth();
    } else if (params.get('auth') === 'failed') {
      history.replaceState({}, '', location.pathname);
      alert('Authentication failed. Please try again.');
    }

    checkAuth();
  </script>
</body>
</html>
